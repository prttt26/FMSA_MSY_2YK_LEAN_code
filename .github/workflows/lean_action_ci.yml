name: Frozen MSA Foundation CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Validate frozen foundation hashes
        run: python3 formalization/audit_foundation.py
      - name: Install elan
        run: |
          curl -o elan-init.sh -sSfL https://elan.lean-lang.org/elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned mathlib artifacts
        run: lake exe cache get
      # LeanCode/YukawaOZ/ExactMSASparseDt2.lean alone peaks at about 21 GB RSS
      # (measured 2026-10-22), above the hosted runner's 16 GB RAM; without swap the
      # runner is killed (exit 143). Build that module first, on its own, with swap.
      - name: Add swap on the temporary disk
        run: |
          df -h / /mnt
          sudo fallocate -l 28G /mnt/lean-swap
          sudo chmod 600 /mnt/lean-swap
          sudo mkswap /mnt/lean-swap
          sudo swapon /mnt/lean-swap
          free -h
      - name: Build the memory-heavy sparse certificate module first
        run: lake build LeanCode.YukawaOZ.ExactMSASparseDt2
      - name: Build MSA and first truncation
        run: lake build
