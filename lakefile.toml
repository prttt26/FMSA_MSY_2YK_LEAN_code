name = "MSA_and_1st_Truncation"
packagesDir = "../.lake/packages"
version = "1.0.15"
keywords = ["math"]
defaultTargets = ["MSA_and_1st_Truncation"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
weak.linter.style.longLine = false # disabled project-wide; `weak.` defers it until Mathlib registers the option (a plain entry is an unknown `-D` at parse time and breaks the build)

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[lean_lib]]
name = "MSA_and_1st_Truncation"
roots = ["MSA_and_1st_Truncation", "LeanCode"]

# Paper formalization, included by the default package entry.
[[lean_lib]]
name = "FMSAPaper"

# Compatibility certificate for the proved scalar closure identity.
# The main proof is imported by LeanCode; this legacy API can also be checked separately.
[[lean_lib]]
name = "ExactMSACertificate"
roots = ["LeanCode.YukawaOZ.ExactMSACertificate"]

# Kernel-checked sparse division checkpoints and their small reassembly theorem.
# The original physical bridge is now proved in the main scalar proof chain.
[[lean_lib]]
name = "ExactMSASparseFeasibility"
roots = ["LeanCode.YukawaOZ.ExactMSASparseCheckpoints"]

# Kernel-checked equal-diameter matrix Fourier compatibility certificate.
# Also imported and guarded by the default LeanCode root.
[[lean_lib]]
name = "MatExactMSAEqualDiamCertificate"
roots = ["LeanCode.YukawaOZMix.MatExactMSAEqualDiamCertificate"]

# (BRK.13/16) `MSAMixtureBaxterConv.lean` — real-space Baxter `Q` + convolution core `c`.  It once
# carried the `c = matCoreUneq` seam as a sympy-backed axiom in its own out-of-default certificate lib;
# that axiom is now PROVED std-3 (`baxterConvCore_eq_matCoreUneq_proved`, `MSAMixtureBreakpointConvDirect`),
# so the file is a plain definitions module built as part of the default `LeanCode` root — no separate
# certificate lib is needed.
