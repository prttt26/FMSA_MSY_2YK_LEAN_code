name = "Lean_code"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanCode"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[lean_lib]]
name = "LeanCode"

# MSAEXACT.6 certificate: deliberately OUT of `defaultTargets`, so a normal `lake build` never
# compiles it (it holds a ring-infeasible axiom + its Fourier-layer bridge; see the file's docstring).
# It is not imported by the `LeanCode` root either, so nothing pulls it into the default build.
# Build it on demand with:  lake build ExactMSACertificate
[[lean_lib]]
name = "ExactMSACertificate"
roots = ["LeanCode.YukawaOZ.ExactMSACertificate"]

# Matrix equal-diameter analog: same Fourier-layer discharge for MSAEMIX.4's
# `matExactMSAEqualDiam_hcore`, reducing it to one pure-k-space sympy residual axiom.  Also OUT of
# `defaultTargets` and not imported by the `LeanCode` root.
# Build it on demand with:  lake build MatExactMSAEqualDiamCertificate
[[lean_lib]]
name = "MatExactMSAEqualDiamCertificate"
roots = ["LeanCode.YukawaOZMix.MatExactMSAEqualDiamCertificate"]

# BRK.13 closure seam: the real-space Baxter `Q` + convolution core `c`, and MSAEMIX.4 Stage 3's
# identity `c = matCoreUneq` as one sympy-backed convolution-identity axiom (real-space analog of
# `matExactMSAUnequalDiam_hcore`).  Feeds BRK's hypothesis-parametrised lemmas so the *physical*
# exact-MSA core inherits the smoothness/knot structure.  OUT of `defaultTargets`, not imported by
# the `LeanCode` root, so a normal `lake build` stays std-3.
# Build it on demand with:  lake build MSAMixtureBaxterConvCertificate
[[lean_lib]]
name = "MSAMixtureBaxterConvCertificate"
roots = ["LeanCode.YukawaOZMix.MSAMixtureBaxterConv"]
