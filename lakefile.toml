name = "Lean_code"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanCode"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[lean_lib]]
name = "LeanCode"

# MSAEXACT.6 certificate: deliberately OUT of `defaultTargets`, so a normal `lake build` never
# compiles it (it holds a ring-infeasible axiom + its Fourier-layer bridge; see the file's docstring).
# It is not imported by the `LeanCode` root either, so nothing pulls it into the default build.
# Build it on demand with:  lake build MSAExactCertificate
[[lean_lib]]
name = "MSAExactCertificate"
roots = ["LeanCode.YukawaOZ.MSAExactCertificate"]

# Matrix equal-diameter analog: same Fourier-layer discharge for MSAEMIX.4's
# `matMSAexactEqualDiam_hcore`, reducing it to one pure-k-space sympy residual axiom.  Also OUT of
# `defaultTargets` and not imported by the `LeanCode` root.
# Build it on demand with:  lake build MatMSAExactEqualDiamCertificate
[[lean_lib]]
name = "MatMSAExactEqualDiamCertificate"
roots = ["LeanCode.YukawaOZMix.MatMSAExactEqualDiamCertificate"]
